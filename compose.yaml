services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-api:
    image: jaffelshop-catalog-api:latest
    build:
      context: ./catalog-api
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/shop
      INTERNAL_SECRET: ${INTERNAL_SECRET:-local-development-secret}
      WEB_ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "8080:8080"

  orders-api:
    image: jaffelshop-orders-api:latest
    build:
      context: ./orders-api
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/shop
      CATALOG_API_URL: http://catalog-api:8080
      INTERNAL_SECRET: ${INTERNAL_SECRET:-local-development-secret}
      WEB_ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      catalog-api:
        condition: service_healthy
    ports:
      - "8000:8000"

  webapp:
    image: jaffelshop-webapp:latest
    build:
      context: ./webapp
      args:
        VITE_CATALOG_API_URL: http://localhost:8080
        VITE_ORDERS_API_URL: http://localhost:8000
    ports:
      - "3000:80"

volumes:
  postgres_data:
