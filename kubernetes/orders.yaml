apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: jaffelshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: orders-api
          image: saichalla09/jaffelshop-orders-api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jaffelshop-secrets
                  key: DATABASE_URL
            - name: INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: jaffelshop-secrets
                  key: INTERNAL_SECRET
            - name: CATALOG_API_URL
              valueFrom:
                configMapKeyRef:
                  name: jaffelshop-config
                  key: CATALOG_API_URL
            - name: CATALOG_TIMEOUT_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: jaffelshop-config
                  key: CATALOG_TIMEOUT_SECONDS
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: jaffelshop
spec:
  type: ClusterIP
  selector:
    app: orders-api
  ports:
    - name: http
      port: 8000
      targetPort: http
